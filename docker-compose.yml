# Shared Authentik env for both the server and worker containers (single source of truth).
x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env (openssl rand -base64 60)}
  AUTHENTIK_REDIS__HOST: authentik-redis
  AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD:?set AUTHENTIK_PG_PASSWORD in .env}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # First-boot bootstrap of the initial akadmin account (ignored after the account exists).
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediator-postgres
    environment:
      POSTGRES_USER: mediator
      POSTGRES_PASSWORD: mediator
      POSTGRES_DB: mediator
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mediator-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediator"]
      interval: 5s
      timeout: 5s
      retries: 5

  cups:
    build:
      context: ./cups
    container_name: mediator-cups
    # USB passthrough: only add this when a USB printer is physically attached to this host.
    # Use: docker compose -f docker-compose.yml -f docker-compose.usb.yml up
    # (see docker-compose.usb.yml for the devices: block)
    # CUPS uses the fd limit in internal calculations; unlimited/very high limits cause EFAULT.
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    volumes:
      - cups-socket:/run/cups
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r 2>/dev/null | grep -q 'running'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mediator:
    build: .
    image: ${MEDIATOR_IMAGE:-mediator:latest}
    env_file: .env
    environment:
      MEDIA_ROOT_DIR: /app/dist/backend/webDav
      DATABASE_URL: postgres://mediator:mediator@postgres:5432/mediator
      # CUPS 2.4 removed CUPS-Get-Devices/CUPS-Get-PPDs over TCP. Use the Unix socket
      # (shared volume) for lpinfo/lpadmin. Set printer.server in Admin UI for a remote server.
      CUPS_SERVER: /run/cups/cups.sock
      # Default queue assignments; overridden at runtime via Admin → Printer Settings
      PRINTER_QUEUE: QL800_box
      PRINTER_QUEUE_BOX: QL800_box
      PRINTER_QUEUE_ITEM: QL800_item
      PRINTER_QUEUE_ITEM_SMALL: QL800_item_small
      PRINTER_QUEUE_SHELF: QL800_shelf
      PRINTER_QUEUE_MARKETING: QL800_marketing
    container_name: mediator
    expose:
      - "8080"
    volumes:
      - mediator-data:/var/lib/mediator
      - mediator-media:/app/dist/backend/media
      - /mnt:/app/dist/backend/webDav
      # Shared CUPS socket from the cups service — not :ro because lpadmin writes to socket
      - cups-socket:/run/cups
      - ./config/alt-doc-dirs.json:/etc/mediator/alt-doc-dirs.json:ro
      - mediator-scans:/mnt/mediator-docs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      cups:
        condition: service_healthy

# TODO(ingress-auth): Keep the proxy configuration aligned with docs/setup.md and secrets rotation steps.
  proxy:
    image: nginx:1.25-alpine
    container_name: mediator-proxy
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - ./config/nginx/mediator.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./secrets/tls/tls.key:/etc/nginx/tls/tls.key:ro
      - ./secrets/htpasswd:/etc/nginx/secrets/htpasswd:ro
    depends_on:
      mediator:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Authentik (user management / SSO) -------------------------------------------------
  # Phase 1: stood up alongside the app for admins to configure. Nothing is enforced yet —
  # wiring forward-auth into the proxy + backend role checks is a deliberate follow-up
  # (see the ingress-auth TODO and docs/setup.md). Authentik requires its OWN Postgres +
  # Redis; do not point these at the mediator database.
  authentik-postgresql:
    image: postgres:16-alpine
    container_name: authentik-postgresql
    environment:
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?set AUTHENTIK_PG_PASSWORD in .env}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
    volumes:
      - authentik-postgresql:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_PG_USER:-authentik} -d ${AUTHENTIK_PG_DB:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  authentik-server:
    # Pin AUTHENTIK_TAG in .env to the current stable release (see https://goauthentik.io/docker-compose.yml).
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12.3}
    container_name: authentik-server
    command: server
    environment:
      <<: *authentik-env
    # Admin/login UI published directly for Phase 1 so an admin can configure Authentik
    # before any proxy forward-auth routing exists.
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12.3}
    container_name: authentik-worker
    command: worker
    environment:
      <<: *authentik-env
    # Worker runs as root and mounts the Docker socket to manage the embedded outpost —
    # this is Authentik's standard compose topology.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-media:/media
      - authentik-templates:/templates
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

volumes:
  mediator-data:
    name: mediator-data
  mediator-media:
    name: mediator-media
  mediator-postgres:
    name: mediator-postgres
  nginx-logs:
    name: nginx-logs
  cups-socket:
    name: mediator-cups-socket
  mediator-scans:
    name: mediator-scans
  authentik-postgresql:
    name: authentik-postgresql
  authentik-redis:
    name: authentik-redis
  authentik-media:
    name: authentik-media
  authentik-templates:
    name: authentik-templates

secrets:
  mediator_htpasswd:
    file: ./secrets/htpasswd
