name: Build & Publish Docker image

# Builds the root Dockerfile and pushes to this Gitea instance's built-in
# container registry (Packages), fronted by Traefik at
# gitea.192.168.10.120.nip.io.
#
# Design notes for future-you:
#   * REGISTRY is the Traefik-fronted public host, NOT the internal
#     gitea:3000 backend URL that github.server_url reports. Deriving it from
#     server_url is what pointed the build daemon at an unreachable address.
#   * IMAGE_PATH is owner/repo (from github.repository), which matches the repo
#     in Gitea so the package is LINKED to it (shows under the repo's Packages
#     tab, owned by the repo) rather than floating as an org-level package.
#     A three-segment path (admin/erfassung-configs/mediator-service) does NOT
#     link, because Gitea maps only owner/repo.
#   * Uses the host Docker CLI directly — the same flow that works manually.
#     No Buildx-in-a-container (which has its own network/TLS view), no
#     docker/* marketplace-action fetches, no type=gha cache (GitHub-only).
#   * Auth uses the token Gitea injects automatically; no PAT/secret required.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug token presence
        run: |
          echo "token length: ${#TOK}"
          echo "user: admin"
        env:
          TOK: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build & push (Docker CLI only)
        run: |
          set -euo pipefail

          # Isolate a clean docker config so login + push share the SAME auth
          # and no inherited credsStore/credHelper hijacks the password.
          export DOCKER_CONFIG="$(mktemp -d)"

          REGISTRY="gitea.192.168.10.120.nip.io"
          IMAGE_PATH="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$REGISTRY/$IMAGE_PATH"
          REF="${{ github.ref_name }}"

          echo "${{ secrets.PACKAGE_TOKEN }}" \
            | docker login "$REGISTRY" -u "admin" --password-stdin

          # Prove the auth actually landed before building:
          test -s "$DOCKER_CONFIG/config.json" && echo "config written"
          grep -q "$REGISTRY" "$DOCKER_CONFIG/config.json" && echo "registry auth present"

          TAGS="-t $IMAGE:$(echo "$REF" | tr '/' '-') -t $IMAGE:sha-${GITHUB_SHA::12}"
          if [ "$REF" = "main" ]; then
            TAGS="$TAGS -t $IMAGE:latest"
          fi

          DOCKER_BUILDKIT=1 docker build $TAGS .
          docker push --all-tags "$IMAGE"