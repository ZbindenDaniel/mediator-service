name: Build & Publish Docker image

# Builds the multi-stage root Dockerfile and publishes it to this Gitea
# instance's built-in container registry (Packages). Auth uses the token Gitea
# injects automatically into every Actions run, so no PAT/secret is required.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Gitea container registry lives on the same host as the git server;
      # the domain isn't hardcoded anywhere in the repo, so derive it at runtime.
      - name: Resolve registry host
        run: echo "REGISTRY=$(echo "${{ github.server_url }}" | sed -E 's~^https?://~~')" >> "$GITHUB_ENV"

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        # Dockerfile line 1 is `# syntax=docker/dockerfile:1`, which needs BuildKit.
        uses: docker/setup-buildx-action@v3

      - name: Derive image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the path, fixing the ZbindenDaniel -> zbindendaniel
          # case mismatch that a registry would otherwise reject.
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Fallback for runners that cannot fetch the `docker/*` actions from GitHub.
  # If the marketplace-action job above fails at the `uses:` fetch step, delete
  # the job above and rename this one to `build-and-push` (or just enable it).
  # It uses only the Docker CLI already present on a Docker-capable runner.
  # ---------------------------------------------------------------------------
