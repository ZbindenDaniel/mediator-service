# Label printing (CUPS) for the production stack. Included by the deploy workflow unless the host's
# .env has PRINTING_ENABLED=false — so existing hosts (revamp) keep printing, and a deployment
# without printers (e.g. the catalogue, feature "printing" off) needs neither this file nor ./cups.
#   docker compose -f docker-compose.prod.yaml -f docker-compose.prod.printing.yaml up -d
# Needs the ./cups folder (Dockerfile, drivers, ppds, queues.conf) next to this file.
services:
  cups:
    build:
      context: ./cups
    container_name: mediator-cups
    # USB passthrough: only add this when a USB printer is physically attached to this host.
    # Use: docker compose -f docker-compose.prod.yaml -f docker-compose.prod.printing.yaml -f docker-compose.usb.yml up
    # CUPS uses the fd limit in internal calculations; unlimited/very high limits cause EFAULT.
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    volumes:
      - cups-socket:/run/cups
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r 2>/dev/null | grep -q 'running'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Internal network only — no traefik exposure for CUPS
    networks:
      - erfassung_default

  mediator:
    environment:
      CUPS_SERVER: /run/cups/cups.sock
      PRINTER_QUEUE: QL800_box
      PRINTER_QUEUE_BOX: QL800_box
      PRINTER_QUEUE_ITEM: QL800_item
      PRINTER_QUEUE_ITEM_SMALL: QL800_item_small
      PRINTER_QUEUE_SHELF: QL800_shelf
      PRINTER_QUEUE_MARKETING: QL800_marketing
    volumes:
      - cups-socket:/run/cups
    depends_on:
      cups:
        condition: service_healthy

volumes:
  cups-socket:
    name: mediator-cups-socket
