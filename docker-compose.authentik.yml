# Local/dev: put Authentik forward-auth in front of the app instead of nginx Basic Auth.
#   docker compose -f docker-compose.yml -f docker-compose.authentik.yml up -d
# Without this file the stack keeps the Basic Auth proxy (config/nginx/mediator.conf).
# Guide: docs/detailed/identity-provider.md
services:
  proxy:
    volumes:
      - ./config/nginx/mediator.authentik.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      authentik-server:
        condition: service_healthy

  mediator:
    environment:
      # Reject data requests that arrive without a forward-auth identity (defence in depth).
      AUTH_REQUIRED: "true"
