# =============================================================================
# Mediator behind Authentik forward-auth (nginx) — replaces the Basic Auth in mediator.conf.
# Activate with:  docker compose -f docker-compose.yml -f docker-compose.authentik.yml up -d
# Guide: docs/detailed/identity-provider.md
#
# SECURITY-CRITICAL: the backend TRUSTS X-authentik-username / X-authentik-groups. Every
# location below either sets them ONLY from the outpost's auth_request response, or blanks
# them. Both overwrite any client-supplied copy, so nobody can spoof identity by sending the
# header themselves. Never add a location that proxies to the app without one of the two.
# =============================================================================

log_format auth_log '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Strict zone for browser-facing routes; permissive zone for SPA API traffic.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff"                                  always;
  add_header X-Frame-Options           "SAMEORIGIN"                                always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
  # camera kept enabled — used for QR code scanning
  add_header Permissions-Policy        "geolocation=(), microphone=()"             always;

  access_log /var/log/nginx/access.log auth_log;
  error_log /var/log/nginx/error.log warn;

  # resolver + variables defer DNS lookup to request time (avoids "host not found" at startup)
  resolver 127.0.0.11 valid=30s;
  set $upstream http://mediator:8080;
  set $authentik_host http://authentik-server:9000;

  # --- Authentik embedded outpost (auth check + login/callback flow) ---
  location /outpost.goauthentik.io {
    # No URI after the variable: with a variable, nginx would otherwise replace the whole
    # request URI with that fixed path and every outpost call (auth/nginx, start, callback)
    # would hit the same endpoint.
    proxy_pass              $authentik_host;
    proxy_set_header        Host $host;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
    add_header              Set-Cookie $auth_cookie;
    auth_request_set        $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
  }

  # Not logged in → start the Authentik login flow, then come back to the requested URL.
  location @goauthentik_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
  }

  # --- Intake station API: X-Intake-Token only (a machine, it can't do a browser login) ---
  location /api/intake/ {
    limit_req zone=api_limit burst=300 nodelay;
    proxy_set_header X-authentik-username "";
    proxy_set_header X-authentik-groups   "";
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # --- App API (SPA), including /api/admin/ ---
  # Admin is forward-authed like the rest: the backend lets platform admins in by role. The
  # ADMIN_SECRET bearer only works from inside the host (docker exec), never through here.
  location /api/ {
    limit_req zone=api_limit burst=300 nodelay;
    auth_request        /outpost.goauthentik.io/auth/nginx;
    error_page 401      = @goauthentik_signin;
    auth_request_set    $auth_cookie $upstream_http_set_cookie;
    add_header          Set-Cookie $auth_cookie;
    # Identity comes ONLY from the outpost response; this overwrites any client copy.
    auth_request_set    $ak_username $upstream_http_x_authentik_username;
    auth_request_set    $ak_groups   $upstream_http_x_authentik_groups;
    proxy_set_header    X-authentik-username $ak_username;
    proxy_set_header    X-authentik-groups   $ak_groups;

    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # --- Browser routes (SPA shell, media, print previews, external docs) ---
  location / {
    limit_req zone=auth_limit burst=20 nodelay;
    auth_request        /outpost.goauthentik.io/auth/nginx;
    error_page 401      = @goauthentik_signin;
    auth_request_set    $auth_cookie $upstream_http_set_cookie;
    add_header          Set-Cookie $auth_cookie;
    auth_request_set    $ak_username $upstream_http_x_authentik_username;
    auth_request_set    $ak_groups   $upstream_http_x_authentik_groups;
    proxy_set_header    X-authentik-username $ak_username;
    proxy_set_header    X-authentik-groups   $ak_groups;

    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
