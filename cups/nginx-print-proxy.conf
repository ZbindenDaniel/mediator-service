# CORS proxy in front of CUPS for printer.mode=browser (cloud mediator, printers on the LAN).
#
# Install on the print server (e.g. the Raspberry Pi):
#   sudo apt install nginx
#   sudo cp nginx-print-proxy.conf /etc/nginx/sites-available/print-proxy
#   sudo ln -s /etc/nginx/sites-available/print-proxy /etc/nginx/sites-enabled/
#   # replace https://mediator.example.org below with the mediator's origin (scheme + host, no path)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then in Admin → Drucker-Einstellungen: Druckweg = Browser, Druck-Proxy = http://<raspi-ip>:8631
#
# Why a proxy: CUPS never answers CORS preflights and has no setting for it, so browsers refuse to
# send it application/ipp requests directly. CUPS itself stays untouched: nginx reaches it via
# localhost, which the default cupsd.conf already allows.

server {
    listen 8631;

    # Only the print queues are exposed; /admin, /jobs etc. stay unreachable through the proxy.
    location /printers/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://mediator.example.org";
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            # Legacy Private Network Access preflight header; harmless for browsers that ignore it.
            add_header Access-Control-Allow-Private-Network "true";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }

        add_header Access-Control-Allow-Origin "https://mediator.example.org" always;

        proxy_pass http://127.0.0.1:631;
        # CUPS rejects unknown Host headers ("Bad Request"); localhost is always accepted.
        proxy_set_header Host localhost;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location / {
        return 403;
    }
}
