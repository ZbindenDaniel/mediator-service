# CORS proxy in front of CUPS for printer.mode=browser (cloud mediator, printers on the LAN).
# Reference only: compare with the config on the print server (Raspi), it is not used by the image.
#
# Files on the print server:
#   /etc/nginx/conf.d/print-origins.conf   allowed app origins (map below)
#   /etc/nginx/print-tls/                   server cert/key + ca.crt (the CA clients must trust)
#   /etc/nginx/print-users                  htpasswd file for basic auth
#
# Mediator: Admin → Drucker-Einstellungen
#   Druckweg = Browser, Druck-Proxy = https://<raspi-ip>,
#   Druck-Proxy Benutzer/Passwort = an entry of /etc/nginx/print-users
#
# Why a proxy: CUPS never answers CORS preflights and has no setting for it, so browsers refuse to
# send it application/ipp requests directly. CUPS stays untouched: nginx reaches it via localhost.

# --- /etc/nginx/conf.d/print-origins.conf --------------------------------------------------------
# Exact origins only (scheme + host [+ port], no path, no trailing slash). Anything else gets ''
# and therefore no CORS headers, so the browser blocks the request.
#
# map $http_origin $print_cors_origin {
#     default                      "";
#     "https://localhost"          $http_origin;   # local test stack
#     "https://mediator.example"   $http_origin;   # production domain
# }

server {
    listen 443 ssl;

    # The certificate must name the address the browser uses (SAN IP:192.168.10.183 or the DNS
    # name), and every client must trust the CA (ca.crt), otherwise fetch() fails without detail.
    ssl_certificate     /etc/nginx/print-tls/server.crt;
    ssl_certificate_key /etc/nginx/print-tls/server.key;

    # Exactly /printers/<queue> (CUPS queue-name characters) — every queue, but no sub-paths, so
    # /admin, /jobs and traversal tricks stay unreachable. Regex beats `location /`; `= /health` beats both.
    location ~ ^/printers/[A-Za-z0-9_.-]+$ {
        # Preflights never carry credentials. `return` runs in nginx's rewrite phase, before
        # auth_basic (access phase), so OPTIONS is answered without asking for a password.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $print_cors_origin;
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            # Authorization must be listed, or the browser drops the basic-auth header.
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Allow-Private-Network "true";
            add_header Access-Control-Max-Age 86400;
            add_header Vary Origin;
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }

        auth_basic           "print";
        auth_basic_user_file /etc/nginx/print-users;

        # `always` so 401/5xx responses are readable by the page (shown as "Zugangsdaten abgelehnt"
        # instead of a generic network error).
        add_header Access-Control-Allow-Origin $print_cors_origin always;
        add_header Vary Origin always;

        proxy_pass http://127.0.0.1:631;
        # CUPS rejects unknown Host headers ("Bad Request"); localhost is always accepted.
        proxy_set_header Host localhost;
        # The proxy's basic auth is not meant for CUPS.
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location / {
        return 403;
    }
}
