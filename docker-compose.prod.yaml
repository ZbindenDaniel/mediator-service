services:
  postgres:
    image: postgres:16-alpine
    container_name: mediator-postgres
    environment:
      POSTGRES_USER: mediator
      POSTGRES_PASSWORD: mediator
      POSTGRES_DB: mediator
    # Host-local only: published on all interfaces it would expose the DB (default password) to the
    # internet once the VM is public. Host tools/backups still reach it on 127.0.0.1.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mediator-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediator"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erfassung_default

  mediator:
    # The deploy workflow sets MEDIATOR_IMAGE to the Gitea-registry image; the ghcr default
    # only applies to a manual `docker compose up` without it.
    image: ${MEDIATOR_IMAGE:-ghcr.io/zbindendaniel/mediator-service:3.0}
    env_file: .env
    environment:
      MEDIA_ROOT_DIR: /app/dist/backend/webDav
      DATABASE_URL: postgres://mediator:mediator@postgres:5432/mediator
    container_name: mediator
    expose:
      - "8080"
    volumes:
      - mediator-data:/var/lib/mediator
      - mediator-media:/app/dist/backend/media
      - /mnt:/app/dist/backend/webDav
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erfassung.rule=Host(`erfassung.${VM_IP}.nip.io`)"
      - "traefik.http.routers.erfassung.tls=true"
      - "traefik.http.services.erfassung.loadbalancer.server.port=8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erfassung_default
      - traefik_proxy

volumes:
  mediator-data:
    name: mediator-data
  mediator-media:
    name: mediator-media
  mediator-postgres:
    name: mediator-postgres
  nginx-logs:
    name: nginx-logs
  cups-socket:
    name: mediator-cups-socket

networks:
  erfassung_default:
  traefik_proxy:
     external: true
